<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待办事项应用 - Todo App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 待办事项</h1>
            <p class="subtitle">Todo App - 使用本地存储管理任务</p>
        </header>

        <main>
            <!-- 输入区域 -->
            <section class="input-section">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="todoInput" 
                        placeholder="输入新的待办事项..."
                        class="todo-input"
                    >
                    <button id="addBtn" class="add-btn">添加</button>
                </div>
                
                <div class="categories-input">
                    <input 
                        type="text" 
                        id="categoryInput" 
                        placeholder="输入分类/标签（按Enter添加）..."
                        class="category-input"
                    >
                    <div id="categoryList" class="category-list"></div>
                </div>
            </section>

            <!-- 过滤区域 -->
            <section class="filter-section">
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">全部</button>
                    <button class="filter-btn" data-filter="active">进行中</button>
                    <button class="filter-btn" data-filter="completed">已完成</button>
                </div>
                <div class="category-filters" id="categoryFilters"></div>
            </section>

            <!-- 统计信息 -->
            <section class="stats-section">
                <div class="stat">
                    <span class="stat-label">总计:</span>
                    <span class="stat-value" id="totalCount">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">进行中:</span>
                    <span class="stat-value" id="activeCount">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">已完成:</span>
                    <span class="stat-value" id="completedCount">0</span>
                </div>
            </section>

            <!-- 待办事项列表 -->
            <section class="todos-section">
                <div id="todoList" class="todo-list"></div>
                <div id="emptyState" class="empty-state">
                    <p>🎯 暂无待办事项</p>
                    <p class="empty-hint">开始添加您的第一个任务吧！</p>
                </div>
            </section>

            <!-- 操作按钮 -->
            <section class="actions-section">
                <button id="clearCompletedBtn" class="clear-btn">清除已完成</button>
                <button id="exportBtn" class="export-btn">导出数据</button>
                <button id="clearAllBtn" class="clear-all-btn">清空全部</button>
            </section>
        </main>

        <footer>
            <p>💾 数据已自动保存到本地存储</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
